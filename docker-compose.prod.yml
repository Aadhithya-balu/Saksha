# =============================================================
# Saksha PRODUCTION compose — single all-in-one container.
#
# This runs the image built from the REPO-ROOT Dockerfile, which bundles:
#   - React frontend
#   - Nginx reverse proxy (port 80)
#   - FastAPI backend (internal :8000)
#   - ML libraries (LightGBM, XGBoost, sklearn, ...)
#
# The production database is hosted Supabase PostgreSQL (NOT a local
# container). Neo4j is hosted Neo4j Aura. Supply all secrets via an
# environment file (.env) or the platform secret manager; nothing is
# hardcoded and no secrets are committed.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================
services:
  saksha:
    image: saksha:latest        # replace with your Docker Hub tag
    restart: unless-stopped
    ports:
      - "80:80"                 # only port 80 is exposed
    env_file:
      - .env                    # APP_ENV, SAKSHA_DATA_MODE, JWT_SECRET_KEY,
                                # SUPABASE_DB_*, SUPABASE_URL, NEO4J_*, etc.
    # Optional: persistent evidence-file storage. Container filesystem is
    # ephemeral; mount a volume for local uploads when NOT using Supabase
    # Storage (preferred for persistence is SUPABASE_STORAGE_BUCKET).
    volumes:
      - saksha_uploads:/app/uploads
    # Note: no depends_on for a local database — production uses Supabase.

volumes:
  saksha_uploads:
